name: CI

permissions:
  contents: read

on:
  push:
    branches: [ruby]
  pull_request:
    branches: [ruby]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate-data:
    name: Validate desktop/appstream/schema data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: rake data:validate
        run: nix develop --command rake data:validate

  rspec:
    name: Run the rspec suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: bundle exec rspec (under xvfb, dev shell's documented command)
        run: >
          nix develop --command xvfb-run -a ruby -e
          'require "rspec/core"; exit RSpec::Core::Runner.run(["--require", "spec_helper", "--format", "progress", "spec"])'

  drive:
    name: Drive the app end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: xvfb-run ruby test/drive_wordbook.rb
        run: nix develop --command xvfb-run -a ruby test/drive_wordbook.rb
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drive-screenshots
          path: tmp/shots/*.png
          if-no-files-found: ignore
      - name: xvfb-run ruby test/drive_search_provider_dbus.rb
        run: nix develop --command xvfb-run -a ruby test/drive_search_provider_dbus.rb

  flatpak-builder:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-nightly
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: "wordbook-rb-devel.flatpak"
          manifest-path: "build-aux/flatpak/dev.mufeed.Wordbook.Devel.json"
          cache-key: flatpak-builder-${{ github.sha }}
